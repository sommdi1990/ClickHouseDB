version: "3.9"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: music_school_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP interface
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=music_school
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8123/?query=SELECT%201 || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20

  tabix:
    image: spoonest/clickhouse-tabix-web-client:latest
    container_name: music_school_tabix
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      clickhouse:
        condition: service_healthy

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: music_school_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=music_school
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:


